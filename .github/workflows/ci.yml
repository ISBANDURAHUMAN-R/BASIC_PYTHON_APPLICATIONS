name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Python Syntax Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Python Modules
        run: |
          python -m py_compile CALCULATOR.py
          python -m py_compile PASSWORD_GENERATOR.py
          python -m py_compile ROCK_PAPER_SCISSOR.py
          python -m py_compile TO_DO_LIST.py
          echo "All CodSoft Python applications compiled successfully."
